services:
  bot:
    build: .
    image: discordstreak
    container_name: discordstreak
    restart: unless-stopped
    env_file: .env
    environment:
      # Overrides DB_PATH from .env so the database always lands in the volume.
      DB_PATH: /data/streaks.sqlite
    volumes:
      - streak-data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  streak-data:
